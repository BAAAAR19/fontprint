name: Feature or research idea
description: Propose an improvement to modelling, calibration, or the review workflow.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What review problem does this solve?
      description: Describe the document-analysis situation that is currently poorly served.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
    validations:
      required: true
  - type: textarea
    id: evaluation
    attributes:
      label: How would we know it worked?
      description: Which metric in `fontprint benchmark` or `run.json` should move, and by how much?
    validations:
      required: true
