name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CPU wheels keep the matrix fast; PyPI stays available as a fallback index.
  PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu

jobs:
  lint:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check src tests scripts
      - run: python -m ruff format --check src tests scripts
      - run: python -m mypy src/fontprint

  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Latin font faces for the synthesis tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu fonts-liberation
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest --cov=fontprint --cov-report=term-missing --cov-report=xml --cov-fail-under=85
      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  end-to-end:
    name: end-to-end smoke run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Latin font faces
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu fonts-liberation fonts-freefont-ttf
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Train a two-epoch model
        run: fontprint train --quick
      - name: Score a controlled specimen
        run: |
          fontprint synthesize --output specimen.png --tampered
          fontprint analyze specimen.png --checkpoint artifacts/fontprint.pt --overlay evidence.png
      - name: Measure end-to-end detection quality
        run: fontprint benchmark --checkpoint artifacts/fontprint.pt --documents 8 --markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Export the ONNX bundle
        run: fontprint export-onnx --checkpoint artifacts/fontprint.pt --output artifacts/fontprint.onnx
      - name: Upload the smoke-run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smoke-run
          path: |
            artifacts/run.json
            artifacts/benchmark.json
            evidence.png
          retention-days: 7

  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag fontprint:ci .
      - name: The image must expose a working CLI
        run: docker run --rm fontprint:ci --version
